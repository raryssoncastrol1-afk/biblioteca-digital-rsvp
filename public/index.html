<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Biblioteca Digital & Leitor RSVP Focus - Leitura dinâmica acelerada, ergonomia visual e gestão offline de acervos digitais." />
  <meta name="theme-color" content="#110f0c" />
  <title>Biblioteca Digital & Leitor RSVP Focus</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <!-- Fontes Científicas Ergonômicas -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400&family=Lexend:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/opendyslexic@2.1.0/opendyslexic.css" />

  <script>
    (function() {
      try {
        var mode = localStorage.getItem('rsvp-app-theme') || 'system';
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var dark = mode === 'dark' || (mode === 'system' && mq.matches);
        document.documentElement.classList.toggle('dark', dark);
        if (mode === 'system') mq.addEventListener('change', function(e) {
          document.documentElement.classList.toggle('dark', e.matches);
        });
      } catch(e) { document.documentElement.classList.add('dark'); }
    })();
  </script>

  <!-- Tailwind CSS via CDN com configuração inline -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['"Fraunces"', 'Georgia', 'serif'],
            atkinson: ['"Atkinson Hyperlegible"', 'sans-serif'],
            lexend: ['"Lexend"', 'sans-serif'],
            dyslexic: ['"OpenDyslexic"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: {
              50: '#fef8e7', 100: '#fdf0c4', 200: '#fae08a',
              300: '#f5cb47', 400: '#e8b41c', 500: '#c99a14',
              600: '#a67d0f', 700: '#85630d', 800: '#6e5210', 900: '#5c4414'
            },
            ink: {
              950: '#110f0c', 900: '#1a1714', 850: '#1e1b16',
              800: '#242018', 700: '#2e2920', 600: '#3a342a',
              500: '#4d463a', 400: '#6b6355'
            },
            paper: {
              50: '#faf6ee', 100: '#f4eedf', 200: '#e8dfd0',
              300: '#d6cbb6', 400: '#b8ab96', 500: '#9a8d7a'
            },
            lamp: {
              50: '#fef8e7', 100: '#fdf0c4', 200: '#fae08a',
              300: '#f5cb47', 400: '#e8b41c', 500: '#c99a14',
              600: '#a67d0f', 700: '#85630d', 800: '#6e5210', 900: '#5c4414'
            }
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --app-bg: #faf6ee;
      --app-text: #1a1714;
      --app-border: #e2ddd4;
    }
    .dark {
      --app-bg: #110f0c;
      --app-text: #ece5d8;
      --app-border: #2e2920;
    }
    ::selection {
      background: rgba(232, 180, 28, 0.3);
      color: inherit;
    }
    :focus-visible {
      outline: 2px solid #e8b41c;
      outline-offset: 2px;
      border-radius: 6px;
    }
    @keyframes os-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes os-sheet-in {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .os-fade-in { animation: os-fade-in 180ms ease-out both; }
    .os-sheet-in { animation: os-sheet-in 240ms ease-out both; }
    @media (prefers-reduced-motion: reduce) {
      .os-fade-in, .os-sheet-in { animation: none; }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(184, 171, 150, 0.25); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(184, 171, 150, 0.45); }
    body {
      background-color: var(--app-bg);
      color: var(--app-text);
      -webkit-font-smoothing: antialiased;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    body.modal-open { overflow: hidden; position: fixed; width: 100%; }
    @media (hover: none) { .hover-reveal { opacity: 1 !important; } }
    .dark body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 180px 180px;
    }
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      height: 70vh;
      background: radial-gradient(ellipse at center, rgba(232, 180, 28, 0.07) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }
    html:not(.dark) body::before { opacity: 0.4; }
    html.dark body::before { opacity: 1; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <!-- Bundle Transpilado e Minificado via esbuild -->
  <script src="/reader.bundle.js"></script>

  <!-- Registro do Service Worker PWA com atualização automática -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let reg of registrations) {
          reg.update();
        }
      });
      navigator.serviceWorker.register('/sw.js?v=3').catch(err => {
        console.warn('Falha ao registrar Service Worker:', err);
      });
    }
  </script>
</body>
</html>
